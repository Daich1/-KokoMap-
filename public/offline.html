<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>オフライン - ココマップ</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fbfa;
        color: #1a2b28;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1615; color: #e8f0ee; }
      }
      .icon { font-size: 56px; }
      h1 { font-size: 20px; margin: 0; }
      p { font-size: 14px; opacity: 0.7; margin: 0; }
      button {
        margin-top: 12px;
        padding: 10px 24px;
        border: none;
        border-radius: 12px;
        background: #008f81;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="icon">🗺️</div>
    <h1>オフラインです</h1>
    <p>インターネット接続を確認してください。</p>
    <button onclick="location.reload()">再読み込み</button>
  </body>
</html>
